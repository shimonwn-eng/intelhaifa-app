<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>ביקורת בטיחות – מטבחי Intel חיפה</title>
<meta name="theme-color" content="#1a237e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="בטיחות Intel">
<link rel="manifest" href="data:application/json;charset=utf-8,%7B%22name%22%3A%22%D7%91%D7%98%D7%99%D7%97%D7%95%D7%AA%20Intel%22%2C%22short_name%22%3A%22%D7%91%D7%98%D7%99%D7%97%D7%95%D7%AA%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%231a237e%22%2C%22theme_color%22%3A%22%231a237e%22%7D">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Arial,sans-serif;background:#f0f2f5;color:#1a1a2e;font-size:16px;min-height:100vh}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}

/* Header */
.hdr{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:18px 16px 14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.hdr h1{font-size:1.25rem;font-weight:700;letter-spacing:.3px}
.hdr .sub{font-size:.8rem;opacity:.85;margin-top:3px}

/* Home screen */
.home-body{flex:1;padding:20px 16px;overflow-y:auto}
.home-card{background:#fff;border-radius:14px;padding:22px 18px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}
.home-card h2{color:#1a237e;font-size:1rem;margin-bottom:14px;border-bottom:2px solid #e8eaf6;padding-bottom:10px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:.85rem;font-weight:600;color:#555;margin-bottom:5px}
.form-group input, .form-group select{width:100%;padding:10px 12px;border:1.5px solid #ddd;border-radius:8px;font-size:.95rem;font-family:inherit;color:#1a1a2e;background:#fafafa}
.form-group input:focus, .form-group select:focus{outline:none;border-color:#1a237e;background:#fff}

.site-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.site-btn{padding:14px 8px;border:2px solid #c5cae9;border-radius:10px;background:#fff;color:#1a237e;font-size:.9rem;font-weight:600;font-family:inherit;cursor:pointer;text-align:center;transition:all .2s}
.site-btn:active,.site-btn.sel{background:#1a237e;color:#fff;border-color:#1a237e;transform:scale(.97)}

.start-btn{width:100%;padding:15px;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;border:none;border-radius:12px;font-size:1.05rem;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(26,35,126,.4);margin-top:6px}
.start-btn:active{transform:scale(.98)}
.start-btn:disabled{background:#b0bec5;box-shadow:none;cursor:default}

/* Reports list */
.reports-section{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.report-item{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #f0f0f0}
.report-item:last-child{border-bottom:none}
.rep-info{flex:1}
.rep-title{font-size:.9rem;font-weight:600;color:#1a237e}
.rep-meta{font-size:.75rem;color:#888;margin-top:2px}
.rep-score{font-size:.85rem;font-weight:700;padding:3px 8px;border-radius:6px}
.rep-score.hi{background:#e8f5e9;color:#2e7d32}
.rep-score.mid{background:#fff8e1;color:#f57f17}
.rep-score.lo{background:#ffebee;color:#c62828}
.rep-btn{background:#e8eaf6;color:#1a237e;border:none;border-radius:7px;padding:6px 10px;font-size:.78rem;font-family:inherit;cursor:pointer;margin-right:4px}

/* Form screen */
.form-hdr{background:linear-gradient(135deg,#1a237e,#283593);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px}
.back-btn{background:rgba(255,255,255,.2);border:none;color:#fff;border-radius:8px;padding:7px 12px;font-size:.85rem;font-family:inherit;cursor:pointer}
.form-hdr-info{flex:1}
.form-hdr-info h2{font-size:1rem;font-weight:700}
.form-hdr-info .meta{font-size:.75rem;opacity:.85;margin-top:2px}

.progress-bar-wrap{background:#283593;padding:0 16px 10px}
.progress-bar{background:rgba(255,255,255,.25);border-radius:4px;height:5px}
.progress-fill{background:#fff;height:5px;border-radius:4px;transition:width .3s}
.progress-text{color:rgba(255,255,255,.85);font-size:.72rem;text-align:center;margin-top:4px}

.form-body{flex:1;overflow-y:auto;padding:12px 14px 100px}

.section-card{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 6px rgba(0,0,0,.07);overflow:hidden}
.section-title{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;user-select:none}
.section-title h3{font-size:.95rem;font-weight:700;color:#1a237e;display:flex;align-items:center;gap:6px}
.section-num{background:#1a237e;color:#fff;border-radius:50%;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
.section-score{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:5px}
.sec-tog{font-size:.7rem;color:#888}

.q-item{padding:10px 14px;border-top:1px solid #f5f5f5}
.q-text{font-size:.88rem;color:#333;margin-bottom:8px;line-height:1.45}
.q-num{color:#1a237e;font-weight:700;font-size:.8rem}
.status-row{display:flex;gap:6px;flex-wrap:wrap}
.st-btn{padding:6px 10px;border-radius:7px;border:1.5px solid #ddd;background:#fafafa;font-size:.78rem;font-family:inherit;cursor:pointer;font-weight:500;transition:all .15s}
.st-btn.ok.sel{background:#e8f5e9;border-color:#4caf50;color:#2e7d32;font-weight:700}
.st-btn.partial.sel{background:#fff8e1;border-color:#ff9800;color:#e65100;font-weight:700}
.st-btn.fail.sel{background:#ffebee;border-color:#f44336;color:#c62828;font-weight:700}
.st-btn.na.sel{background:#f3e5f5;border-color:#9c27b0;color:#6a1b9a;font-weight:700}

.note-row{margin-top:7px;display:flex;gap:6px;align-items:center}
.note-input{flex:1;padding:7px 10px;border:1.5px solid #ddd;border-radius:7px;font-size:.82rem;font-family:inherit;background:#fafafa}
.note-input:focus{outline:none;border-color:#1a237e}
.cam-btn{background:#e8eaf6;border:none;color:#1a237e;border-radius:7px;padding:7px 9px;font-size:1rem;cursor:pointer;flex-shrink:0}

/* Bottom bar */
.bottom-bar{position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid #e0e0e0;padding:10px 14px;display:flex;gap:8px;box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:100}
.bottom-bar button{flex:1;padding:11px 6px;border:none;border-radius:9px;font-size:.82rem;font-weight:600;font-family:inherit;cursor:pointer}
.btn-save{background:#e8eaf6;color:#1a237e}
.btn-mail{background:#e3f2fd;color:#0d47a1}
.btn-pdf{background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;box-shadow:0 3px 10px rgba(26,35,126,.35)}
.btn-save:active,.btn-mail:active,.btn-pdf:active{transform:scale(.97)}

/* Summary screen */
.summary-body{flex:1;overflow-y:auto;padding:16px 14px 90px}
.summary-card{background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:14px;text-align:center}
.big-score{font-size:3rem;font-weight:800;margin:8px 0 4px}
.big-score.hi{color:#2e7d32}
.big-score.mid{color:#f57f17}
.big-score.lo{color:#c62828}
.score-label{font-size:.85rem;color:#666;margin-bottom:12px}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.sc-box{padding:12px;border-radius:10px;text-align:center}
.sc-box .n{font-size:1.5rem;font-weight:700}
.sc-box .l{font-size:.72rem;margin-top:2px}
.sc-ok{background:#e8f5e9;color:#2e7d32}
.sc-partial{background:#fff8e1;color:#e65100}
.sc-fail{background:#ffebee;color:#c62828}
.sc-na{background:#f3e5f5;color:#6a1b9a}

.issues-card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.issues-card h3{color:#c62828;font-size:.95rem;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.issue-row{padding:8px 0;border-bottom:1px solid #fff3f3;display:flex;gap:8px}
.issue-row:last-child{border-bottom:none}
.issue-num{background:#c62828;color:#fff;border-radius:5px;padding:1px 6px;font-size:.72rem;font-weight:700;flex-shrink:0;align-self:flex-start;margin-top:1px}
.issue-text{font-size:.83rem;color:#333;line-height:1.4}

/* Camera modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:500px}
.modal-box h3{font-size:1rem;font-weight:700;margin-bottom:14px;color:#1a237e}
.cam-preview{width:100%;border-radius:10px;background:#000;display:none;max-height:300px;object-fit:cover}
.modal-btns{display:flex;gap:10px;margin-top:14px}
.modal-btns button{flex:1;padding:12px;border:none;border-radius:9px;font-size:.9rem;font-family:inherit;font-weight:600;cursor:pointer}
.btn-snap{background:#1a237e;color:#fff}
.btn-cancel{background:#f5f5f5;color:#333}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:9px 18px;border-radius:25px;font-size:.83rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* Responsive */
@media(min-width:500px){
  .form-body,.home-body,.summary-body{max-width:500px;margin:0 auto}
  .bottom-bar{max-width:500px;left:50%;transform:translateX(-50%);right:auto;width:100%}
}
</style>
</head>
<body>

<!-- HOME -->
<div id="homeScreen" class="screen active">
  <div class="hdr">
    <h1>🛡️ ביקורת בטיחות</h1>
    <div class="sub">מטבחי Intel חיפה – צ׳קליסט שבועי</div>
  </div>
  <div class="home-body">
    <div class="home-card">
      <h2>📋 פרטי הביקורת</h2>
      <div class="form-group">
        <label>שם מבצע הביקורת</label>
        <input type="text" id="inpInspector" placeholder="שם מלא" autocomplete="name">
      </div>
      <div class="form-group">
        <label>אתר / בניין</label>
        <input type="text" id="inpSite" placeholder="לדוג׳ בניין 28, מטבח ראשי" autocomplete="off">
      </div>
      <div class="form-group">
        <label>שעת סיור</label>
        <input type="time" id="inpTime">
      </div>
      <div class="form-group">
        <label>תאריך</label>
        <input type="date" id="inpDate">
      </div>
      <div class="form-group">
        <label>אימייל לשליחת דוח (אופציונלי)</label>
        <input type="email" id="inpEmail" placeholder="example@intel.com" autocomplete="email">
      </div>
      <button class="start-btn" id="startBtn" onclick="startInspection()">התחל ביקורת ←</button>
    </div>

    <div class="reports-section" id="reportsSection" style="display:none">
      <h2 style="color:#1a237e;font-size:1rem;margin-bottom:14px;border-bottom:2px solid #e8eaf6;padding-bottom:10px">📁 דוחות קודמים</h2>
      <div id="reportsList"></div>
    </div>

    <div style="background:#e8eaf6;border-radius:10px;padding:12px 14px;margin-top:16px;font-size:.78rem;color:#3949ab;line-height:1.55">
      <strong>📱 להוספה למסך הבית (iOS):</strong> לחץ על <strong>שתף</strong> ← <strong>"הוסף למסך הבית"</strong>
    </div>
  </div>
</div>

<!-- FORM -->
<div id="formScreen" class="screen">
  <div class="form-hdr">
    <button class="back-btn" onclick="goHome()">← חזור</button>
    <div class="form-hdr-info">
      <h2>צ׳קליסט שבועי – בטיחות</h2>
      <div class="meta" id="formMeta">18 נקודות בדיקה</div>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">0 / 18 נענו</div>
  </div>
  <div class="form-body" id="formBody"></div>
  <div class="bottom-bar">
    <button class="btn-save" onclick="doSave()">💾 שמור</button>
    <button class="btn-mail" onclick="doMail()">✉️ מייל</button>
    <button class="btn-pdf" onclick="doPDF()">📄 PDF</button>
  </div>
</div>

<!-- SUMMARY -->
<div id="summaryScreen" class="screen">
  <div class="form-hdr">
    <button class="back-btn" onclick="showScreen('formScreen')">← חזור</button>
    <div class="form-hdr-info">
      <h2>סיכום ביקורת</h2>
      <div class="meta" id="sumMeta"></div>
    </div>
  </div>
  <div class="summary-body">
    <div class="summary-card">
      <div style="font-size:.85rem;color:#666">ציון כולל</div>
      <div class="big-score" id="bigScore">--%</div>
      <div class="score-label" id="scoreLabel"></div>
      <div class="score-grid">
        <div class="sc-box sc-ok"><div class="n" id="sc-ok">0</div><div class="l">✅ תקין</div></div>
        <div class="sc-box sc-partial"><div class="n" id="sc-partial">0</div><div class="l">⚠️ חלקי</div></div>
        <div class="sc-box sc-fail"><div class="n" id="sc-fail">0</div><div class="l">❌ לא תקין</div></div>
        <div class="sc-box sc-na"><div class="n" id="sc-na">0</div><div class="l">N/A</div></div>
      </div>
    </div>
    <div class="issues-card" id="issuesCard" style="display:none">
      <h3>⚠️ ממצאים הדורשים טיפול</h3>
      <div id="issuesList"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:14px">
      <button style="flex:1;padding:13px;border:none;border-radius:10px;background:#e3f2fd;color:#0d47a1;font-weight:700;font-family:inherit;font-size:.9rem;cursor:pointer" onclick="doMail()">✉️ שלח מייל</button>
      <button style="flex:1;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;font-weight:700;font-family:inherit;font-size:.9rem;cursor:pointer" onclick="doPDF()">📄 ייצוא PDF</button>
    </div>
    <button style="width:100%;padding:13px;border:none;border-radius:10px;background:#e8eaf6;color:#1a237e;font-weight:700;font-family:inherit;font-size:.9rem;cursor:pointer;margin-top:10px" onclick="goHome()">🏠 ביקורת חדשה</button>
  </div>
</div>

<!-- Camera Modal -->
<div class="modal-overlay hidden" id="camModal">
  <div class="modal-box">
    <h3>📷 צלם ממצא</h3>
    <video class="cam-preview" id="camPreview" autoplay playsinline></video>
    <canvas id="camCanvas" style="display:none"></canvas>
    <input type="file" id="camFileFallback" accept="image/*" capture="environment" style="display:none">
    <div class="modal-btns">
      <button class="btn-snap" id="snapBtn" onclick="camSnap()">📸 צלם</button>
      <button class="btn-cancel" onclick="camClose()">ביטול</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== DATA ======
const QUESTIONS = [
  {id:1, domain:"רצפות ומעברים",    text:"רצפות ומעברים נקיים, יבשים, ללא מכשולים, כבלים, שברים או הפרשי גובה."},
  {id:2, domain:"חירום ומילוט",     text:"דלתות, יציאות חירום ומעברי מילוט פנויים ונגישים."},
  {id:3, domain:"מכונות",           text:"מגנים, מכסים ואינטרלוקים קיימים, שלמים ואינם מנוטרלים; לחצני עצירת חירום נגישים, מסומנים וללא חסימה."},
  {id:4, domain:"עבודה ברעש",       text:"עובדים משתמשים באטמי אוזנים בשטיפת כלים."},
  {id:5, domain:"חשמל",             text:"כבלים, תקעים, שקעים ומאריכים שלמים וללא חימום, שבר או אילתור."},
  {id:6, domain:"קיטור וחום",       text:"סירי קיטור, צנרת, ברזים ומחברים ללא נזילות; בידוד ומיגון תקינים."},
  {id:7, domain:"טיגון וחימום",     text:"צ׳יפסרים, פלטות ומשטחי חימום יציבים; ידיות, מכסים והגנות תקינים."},
  {id:8, domain:"קירור",            text:"דלתות, ידיות, צירים וספים במקררים/מקפיאים שלמים וללא מפגע."},
  {id:9, domain:"קירור",            text:"אין הצטברות מים/קרח או סכנת החלקה בחדרי קירור ובכניסה אליהם."},
  {id:10,domain:"חומרים מסוכנים",  text:"חומרי ניקוי מסומנים, סגורים, מאוחסנים כנדרש ומופרדים ממזון."},
  {id:11,domain:"עגלות",            text:"גלגלים, ידיות, מעצורים ושלדת העגלות תקינים; אין חלקים חדים או רופפים."},
  {id:12,domain:"שינוע",            text:"מסלולי שינוע וספים פנויים ובמצב תקין; אין עומס לא מאובטח על עגלות."},
  {id:13,domain:"מחסנים",           text:"מדפים יציבים ומסודרים; אין עומס יתר, בליטות מסוכנות או חסימת מעברים."},
  {id:14,domain:"רמפה ופריקה",      text:"הרמפה ומשטחי הפריקה שלמים, נקיים וללא בורות, שברים או החלקה; תנועת משאיות והולכי רגל מתבצעת באזור פנוי ומסומן ככל שניתן."},
  {id:15,domain:"סכינים וכלים חדים",text:"סכינים וכלים חדים מאוחסנים במתקן מתאים, עם ידיות שלמות ובמצב תקין."},
  {id:16,domain:"עמדות הגשה",       text:"דלפקים, ויטרינות, מתקני הגשה וציוד חם יציבים וללא שבר/קצה חד/כבל מפריע."},
  {id:17,domain:"ציוד מגן אישי",    text:"ציוד מגן אישי נמצא בצמוד לעמדות עבודה; קיים שימוש בציוד מגן אישי."},
  {id:18,domain:"התנהלות נצפית",    text:"לא נצפה שימוש בציוד פגום, עקיפת מיגון, שינוע מסוכן או אילתור עבודה."},
];

const ST = [
  {v:"ok",     l:"✅ תקין",    cls:"ok"},
  {v:"partial",l:"⚠️ חלקי",   cls:"partial"},
  {v:"fail",   l:"❌ לא תקין", cls:"fail"},
  {v:"na",     l:"N/A",        cls:"na"},
];

// ====== STATE ======
let S = {
  inspector:"", site:"", time:"", date:"", email:"",
  answers:{},   // {qId: {status, note, photo}}
  reports:[], curReport:null,
  camQid:null, camStream:null
};

const KEY_A = "sfA1"; const KEY_R = "sfR1";

function load(){
  try{
    const a=localStorage.getItem(KEY_A); if(a) S.answers=JSON.parse(a);
    const r=localStorage.getItem(KEY_R); if(r) S.reports=JSON.parse(r);
  }catch(e){}
}

function persist(){
  try{
    localStorage.setItem(KEY_A,JSON.stringify(S.answers));
    localStorage.setItem(KEY_R,JSON.stringify(S.reports));
  }catch(e){}
}

// ====== SCREENS ======
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function goHome(){
  showScreen('homeScreen');
  renderReports();
}

// ====== HOME ======
function initHome(){
  const now=new Date();
  document.getElementById('inpDate').value=now.toISOString().split('T')[0];
  const hh=String(now.getHours()).padStart(2,'0');
  const mm=String(now.getMinutes()).padStart(2,'0');
  document.getElementById('inpTime').value=`${hh}:${mm}`;
  load();
  renderReports();
}

function renderReports(){
  const sec=document.getElementById('reportsSection');
  const list=document.getElementById('reportsList');
  if(!S.reports.length){sec.style.display='none';return;}
  sec.style.display='block';
  list.innerHTML=S.reports.slice().reverse().map((r,i)=>{
    const ri=S.reports.length-1-i;
    const sc=r.score;
    const cls=sc>=80?'hi':sc>=50?'mid':'lo';
    return `<div class="report-item">
      <div class="rep-info">
        <div class="rep-title">${r.site||'–'} | ${r.date||'–'}</div>
        <div class="rep-meta">${r.inspector||'–'} | ${r.time||''}</div>
      </div>
      <span class="rep-score ${cls}">${sc}%</span>
      <button class="rep-btn" onclick="loadReport(${ri})">📂</button>
      <button class="rep-btn" onclick="deleteReport(${ri})" style="background:#ffebee;color:#c62828">🗑</button>
    </div>`;
  }).join('');
}

function loadReport(i){
  const r=S.reports[i];
  document.getElementById('inpInspector').value=r.inspector||'';
  document.getElementById('inpSite').value=r.site||'';
  document.getElementById('inpTime').value=r.time||'';
  document.getElementById('inpDate').value=r.date||'';
  document.getElementById('inpEmail').value=r.email||'';
  S.answers=JSON.parse(JSON.stringify(r.answers||{}));
  S.curReport=i;
  renderForm();
  showScreen('formScreen');
}

function deleteReport(i){
  if(!confirm('למחוק דוח זה?')) return;
  S.reports.splice(i,1);
  persist();
  renderReports();
  toast('נמחק');
}

// ====== START ======
function startInspection(){
  const insp=document.getElementById('inpInspector').value.trim();
  const site=document.getElementById('inpSite').value.trim();
  if(!insp){toast('נא להזין שם מבצע הביקורת');return;}
  if(!site){toast('נא להזין אתר / בניין');return;}
  S.inspector=insp;
  S.site=site;
  S.time=document.getElementById('inpTime').value;
  S.date=document.getElementById('inpDate').value;
  S.email=document.getElementById('inpEmail').value.trim();
  S.answers={};
  S.curReport=null;
  renderForm();
  showScreen('formScreen');
}

// ====== FORM RENDER ======
function renderForm(){
  document.getElementById('formMeta').textContent=`${S.site} | ${S.inspector} | ${S.date}`;

  // Group by domain
  const domains={};
  QUESTIONS.forEach(q=>{
    if(!domains[q.domain]) domains[q.domain]=[];
    domains[q.domain].push(q);
  });

  let html='';
  Object.entries(domains).forEach(([dom,qs])=>{
    const domScore=calcDomainScore(qs);
    const scoreCls=domScore===null?'':domScore>=80?'sc-ok':domScore>=50?'sc-partial':'sc-fail';
    const scoreStr=domScore===null?'':domScore+'%';
    html+=`<div class="section-card">
      <div class="section-title" onclick="togSec(this)">
        <h3><span class="section-num">${Object.keys(domains).indexOf(dom)+1}</span>${dom}</h3>
        <span class="section-score ${scoreCls}" id="dscore-${encodeURIComponent(dom)}">${scoreStr}</span>
        <span class="sec-tog">▼</span>
      </div>
      <div class="sec-body">`;
    qs.forEach(q=>{ html+=renderQ(q); });
    html+=`</div></div>`;
  });

  document.getElementById('formBody').innerHTML=html;
  updateProgress();
}

function renderQ(q){
  const ans=S.answers[q.id]||{};
  const stBtns=ST.map(s=>`<button class="st-btn ${s.cls}${ans.status===s.v?' sel':''}" onclick="ansQ(${q.id},'${s.v}')">${s.l}</button>`).join('');
  const photo=ans.photo?`<img src="${ans.photo}" style="width:60px;height:60px;object-fit:cover;border-radius:7px;margin-right:6px;flex-shrink:0">`:'' ;
  return `<div class="q-item" id="q-${q.id}">
    <div class="q-text"><span class="q-num">${q.id}.</span> ${q.text}</div>
    <div class="status-row">${stBtns}</div>
    <div class="note-row">
      ${photo}
      <input class="note-input" type="text" placeholder="הערה / פעולה נדרשת..." value="${ans.note||''}"
        oninput="setNote(${q.id},this.value)" id="note-${q.id}">
      <button class="cam-btn" onclick="openCam(${q.id})">📷</button>
    </div>
  </div>`;
}

function togSec(el){
  const body=el.nextElementSibling;
  const tog=el.querySelector('.sec-tog');
  if(body.style.display==='none'){body.style.display='';tog.textContent='▼';}
  else{body.style.display='none';tog.textContent='◀';}
}

function calcDomainScore(qs){
  const active=qs.filter(q=>S.answers[q.id]&&S.answers[q.id].status&&S.answers[q.id].status!=='na');
  if(!active.length) return null;
  const ok=active.filter(q=>S.answers[q.id].status==='ok').length;
  const partial=active.filter(q=>S.answers[q.id].status==='partial').length;
  return Math.round((ok*100+partial*50)/active.length);
}

// ====== ANSWER ======
function ansQ(qid, status){
  if(!S.answers[qid]) S.answers[qid]={};
  S.answers[qid].status=status;
  // Re-render just this question
  const q=QUESTIONS.find(q=>q.id===qid);
  const el=document.getElementById(`q-${qid}`);
  if(el) el.outerHTML=renderQ(q);
  updateProgress();
  updateDomainScore(q.domain);
  persist();
}

function setNote(qid, val){
  if(!S.answers[qid]) S.answers[qid]={};
  S.answers[qid].note=val;
}

function updateDomainScore(dom){
  const qs=QUESTIONS.filter(q=>q.domain===dom);
  const sc=calcDomainScore(qs);
  const el=document.getElementById('dscore-'+encodeURIComponent(dom));
  if(!el) return;
  el.textContent=sc===null?'':sc+'%';
  el.className='section-score '+(sc===null?'':sc>=80?'sc-ok':sc>=50?'sc-partial':'sc-fail');
}

function updateProgress(){
  const answered=QUESTIONS.filter(q=>S.answers[q.id]&&S.answers[q.id].status).length;
  const total=QUESTIONS.length;
  const pct=Math.round(answered/total*100);
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressText').textContent=`${answered} / ${total} נענו`;
}

// ====== SCORE CALC ======
function calcScore(){
  const active=QUESTIONS.filter(q=>S.answers[q.id]&&S.answers[q.id].status&&S.answers[q.id].status!=='na');
  if(!active.length) return 0;
  const ok=active.filter(q=>S.answers[q.id].status==='ok').length;
  const partial=active.filter(q=>S.answers[q.id].status==='partial').length;
  return Math.round((ok*100+partial*50)/active.length);
}

function getCounts(){
  const ok=QUESTIONS.filter(q=>S.answers[q.id]&&S.answers[q.id].status==='ok').length;
  const partial=QUESTIONS.filter(q=>S.answers[q.id]&&S.answers[q.id].status==='partial').length;
  const fail=QUESTIONS.filter(q=>S.answers[q.id]&&S.answers[q.id].status==='fail').length;
  const na=QUESTIONS.filter(q=>S.answers[q.id]&&S.answers[q.id].status==='na').length;
  return {ok,partial,fail,na};
}

// ====== SAVE ======
function doSave(){
  const score=calcScore();
  const rep={
    inspector:S.inspector, site:S.site, time:S.time, date:S.date, email:S.email,
    answers:JSON.parse(JSON.stringify(S.answers)), score, savedAt:new Date().toISOString()
  };
  if(S.curReport!==null) S.reports[S.curReport]=rep;
  else{ S.reports.push(rep); S.curReport=S.reports.length-1; }
  persist();
  toast('✅ נשמר!');
}

// ====== SUMMARY ======
function showSummary(){
  const score=calcScore();
  const {ok,partial,fail,na}=getCounts();
  document.getElementById('sumMeta').textContent=`${S.site} | ${S.date} | ${S.inspector}`;
  const big=document.getElementById('bigScore');
  big.textContent=score+'%';
  big.className='big-score '+(score>=80?'hi':score>=50?'mid':'lo');
  document.getElementById('scoreLabel').textContent=score>=80?'מצב טוב – המשך לשמור':score>=50?'דרוש שיפור בחלק מהנקודות':'נדרשת התערבות מיידית';
  document.getElementById('sc-ok').textContent=ok;
  document.getElementById('sc-partial').textContent=partial;
  document.getElementById('sc-fail').textContent=fail;
  document.getElementById('sc-na').textContent=na;

  const issues=QUESTIONS.filter(q=>S.answers[q.id]&&(S.answers[q.id].status==='fail'||S.answers[q.id].status==='partial'));
  if(issues.length){
    document.getElementById('issuesCard').style.display='';
    document.getElementById('issuesList').innerHTML=issues.map(q=>{
      const a=S.answers[q.id];
      const badge=a.status==='fail'?'❌':'⚠️';
      const note=a.note?` – ${a.note}`:'';
      return `<div class="issue-row"><span class="issue-num">${q.id}</span><div class="issue-text">${badge} ${q.text}${note}</div></div>`;
    }).join('');
  } else {
    document.getElementById('issuesCard').style.display='none';
  }
  showScreen('summaryScreen');
}

// ====== MAIL ======
function doMail(){
  doSave();
  const score=calcScore();
  const {ok,partial,fail,na}=getCounts();
  const issues=QUESTIONS.filter(q=>S.answers[q.id]&&(S.answers[q.id].status==='fail'||S.answers[q.id].status==='partial'));
  const dateStr=S.date||new Date().toLocaleDateString('he-IL');

  let body=`צ'קליסט בטיחות שבועי – מטבחי Intel חיפה\n`;
  body+=`${'='.repeat(40)}\n\n`;
  body+=`תאריך: ${dateStr}\n`;
  body+=`אתר: ${S.site}\n`;
  body+=`מבצע הביקורת: ${S.inspector}\n`;
  body+=`שעת סיור: ${S.time}\n\n`;
  body+=`ציון כולל: ${score}%\n`;
  body+=`תקין: ${ok} | חלקי: ${partial} | לא תקין: ${fail} | לא רלוונטי: ${na}\n\n`;

  if(issues.length){
    body+=`ממצאים הדורשים טיפול (${issues.length}):\n${'─'.repeat(30)}\n`;
    issues.forEach(q=>{
      const a=S.answers[q.id];
      const st=a.status==='fail'?'לא תקין':'חלקי';
      body+=`[${q.id}] ${q.domain}: ${q.text}\n    סטטוס: ${st}`;
      if(a.note) body+=` | הערה: ${a.note}`;
      body+='\n';
    });
    body+='\n';
  } else {
    body+='✅ לא נמצאו ממצאים הדורשים טיפול.\n\n';
  }

  body+='מפגע מהותי או סיכון מיידי: יש להפסיק שימוש/לבודד לפי הצורך ולדווח מיד לגורם האחראי.\n';
  body+=`\n-- \nנשלח מאפליקציית ביקורת בטיחות Intel`;

  const subj=encodeURIComponent(`ביקורת בטיחות – ${S.site} – ${dateStr}`);
  const to=S.email?encodeURIComponent(S.email):'';
  const bodyEnc=encodeURIComponent(body);
  window.location.href=`mailto:${to}?subject=${subj}&body=${bodyEnc}`;
}

// ====== PDF ======
function doPDF(){
  doSave();
  const score=calcScore();
  const {ok,partial,fail,na}=getCounts();
  const issues=QUESTIONS.filter(q=>S.answers[q.id]&&(S.answers[q.id].status==='fail'||S.answers[q.id].status==='partial'));
  const dateStr=S.date||new Date().toLocaleDateString('he-IL');
  const scoreCls=score>=80?'#2e7d32':score>=50?'#f57f17':'#c62828';
  const scoreBg=score>=80?'#e8f5e9':score>=50?'#fff8e1':'#ffebee';

  let allRows='';
  QUESTIONS.forEach(q=>{
    const a=S.answers[q.id]||{};
    const st=a.status==='ok'?'✅ תקין':a.status==='partial'?'⚠️ חלקי':a.status==='fail'?'❌ לא תקין':a.status==='na'?'N/A':'טרם נבדק';
    const stCl=a.status==='ok'?'#2e7d32':a.status==='partial'?'#e65100':a.status==='fail'?'#c62828':a.status==='na'?'#6a1b9a':'#9e9e9e';
    const stBg=a.status==='ok'?'#e8f5e9':a.status==='partial'?'#fff8e1':a.status==='fail'?'#ffebee':a.status==='na'?'#f3e5f5':'#fafafa';
    const note=a.note||'';
    let photoHtml='';
    if(a.photo) photoHtml=`<br><img src="${a.photo}" style="max-width:100px;max-height:100px;border-radius:4px;margin-top:4px">`;
    allRows+=`<tr>
      <td style="text-align:center;font-weight:700;color:#1a237e">${q.id}</td>
      <td style="color:#555;font-size:.78rem">${q.domain}</td>
      <td style="font-size:.82rem;line-height:1.4">${q.text}</td>
      <td style="text-align:center"><span style="background:${stBg};color:${stCl};padding:3px 8px;border-radius:5px;font-size:.78rem;font-weight:700;white-space:nowrap">${st}</span></td>
      <td style="font-size:.78rem;color:#555">${note}${photoHtml}</td>
    </tr>`;
  });

  let issueRows='';
  if(issues.length){
    issueRows=`<div style="margin-top:18px;background:#fff3f3;border:1.5px solid #ffcdd2;border-radius:10px;padding:14px">
      <h3 style="color:#c62828;margin-bottom:10px;font-size:.9rem">⚠️ ממצאים הדורשים טיפול (${issues.length})</h3>
      ${issues.map(q=>{
        const a=S.answers[q.id];
        const st=a.status==='fail'?'❌ לא תקין':'⚠️ חלקי';
        const note=a.note?` – ${a.note}`:'';
        return `<div style="padding:6px 0;border-bottom:1px solid #ffebee;font-size:.82rem"><strong>[${q.id}] ${q.domain}:</strong> ${q.text} | ${st}${note}</div>`;
      }).join('')}
    </div>`;
  }

  const html=`<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="UTF-8">
  <title>ביקורת בטיחות – ${S.site} – ${dateStr}</title>
  <style>
    body{font-family:Arial,sans-serif;font-size:13px;color:#222;margin:24px;line-height:1.5;direction:rtl}
    h1{color:#1a237e;font-size:1.2rem;margin:0 0 4px}
    .hdr{background:linear-gradient(135deg,#1a237e,#3949ab);color:#fff;padding:16px 20px;border-radius:10px;margin-bottom:18px}
    .hdr .meta{font-size:.8rem;opacity:.85;margin-top:4px}
    .score-box{display:inline-block;background:${scoreBg};color:${scoreCls};font-size:1.6rem;font-weight:800;padding:10px 22px;border-radius:8px;margin:10px 6px 0 0;vertical-align:middle}
    .stat-box{display:inline-block;padding:8px 14px;border-radius:8px;font-size:.82rem;font-weight:600;margin:4px;vertical-align:middle}
    table{width:100%;border-collapse:collapse;margin-top:16px;font-size:.82rem}
    th{background:#1a237e;color:#fff;padding:8px 10px;text-align:right;font-weight:600}
    td{padding:7px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top}
    tr:nth-child(even) td{background:#fafafa}
    .footer{margin-top:20px;padding:12px;background:#fff3e0;border-radius:8px;font-size:.78rem;color:#e65100;border-right:4px solid #ff9800}
    @media print{body{margin:10px}.hdr{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
  </style></head><body>
  <div class="hdr">
    <h1>🛡️ צ׳קליסט בטיחות שבועי – מטבחי Intel חיפה</h1>
    <div class="meta">אתר: ${S.site} &nbsp;|&nbsp; מבצע הביקורת: ${S.inspector} &nbsp;|&nbsp; תאריך: ${dateStr} &nbsp;|&nbsp; שעה: ${S.time}</div>
  </div>

  <div>
    <span class="score-box">${score}%</span>
    <span class="stat-box" style="background:#e8f5e9;color:#2e7d32">✅ תקין: ${ok}</span>
    <span class="stat-box" style="background:#fff8e1;color:#e65100">⚠️ חלקי: ${partial}</span>
    <span class="stat-box" style="background:#ffebee;color:#c62828">❌ לא תקין: ${fail}</span>
    <span class="stat-box" style="background:#f3e5f5;color:#6a1b9a">N/A: ${na}</span>
  </div>

  ${issueRows}

  <table>
    <thead><tr>
      <th style="width:35px">#</th>
      <th style="width:90px">תחום</th>
      <th>נקודת בדיקה</th>
      <th style="width:90px;text-align:center">סטטוס</th>
      <th style="width:140px">הערות</th>
    </tr></thead>
    <tbody>${allRows}</tbody>
  </table>

  <div class="footer">⚠️ מפגע מהותי או סיכון מיידי: יש להפסיק שימוש/לבודד לפי הצורך ולדווח מיד לגורם האחראי.</div>
  <div style="margin-top:12px;font-size:.72rem;color:#aaa;text-align:center">נוצר בתאריך ${new Date().toLocaleString('he-IL')} | אפליקציית ביקורת בטיחות Intel חיפה</div>
  </body></html>`;

  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=`ביקורת-בטיחות-${S.site||'Intel'}-${dateStr}.html`.replace(/\s/g,'-');
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),3000);
  toast('📄 הדוח הורד!');
  showSummary();
}

// ====== CAMERA ======
function openCam(qid){
  S.camQid=qid;
  const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||
    (navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  if(isIOS){
    const inp=document.getElementById('camFileFallback');
    inp.onchange=e=>{
      const f=e.target.files[0]; if(!f) return;
      const r=new FileReader();
      r.onload=ev=>{ savePhoto(ev.target.result); };
      r.readAsDataURL(f);
      inp.value='';
    };
    inp.click();
    return;
  }
  document.getElementById('camModal').classList.remove('hidden');
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})
    .then(stream=>{
      S.camStream=stream;
      const vid=document.getElementById('camPreview');
      vid.srcObject=stream; vid.style.display='block';
    }).catch(()=>{
      camClose();
      const inp=document.getElementById('camFileFallback');
      inp.onchange=e=>{
        const f=e.target.files[0]; if(!f) return;
        const r=new FileReader();
        r.onload=ev=>{ savePhoto(ev.target.result); };
        r.readAsDataURL(f);
        inp.value='';
      };
      inp.click();
    });
}

function camSnap(){
  const vid=document.getElementById('camPreview');
  const can=document.getElementById('camCanvas');
  can.width=vid.videoWidth; can.height=vid.videoHeight;
  can.getContext('2d').drawImage(vid,0,0);
  const data=can.toDataURL('image/jpeg',0.7);
  savePhoto(data);
  camClose();
}

function camClose(){
  if(S.camStream){ S.camStream.getTracks().forEach(t=>t.stop()); S.camStream=null; }
  document.getElementById('camModal').classList.add('hidden');
  const vid=document.getElementById('camPreview');
  vid.srcObject=null; vid.style.display='none';
}

function savePhoto(dataUrl){
  if(!S.answers[S.camQid]) S.answers[S.camQid]={};
  S.answers[S.camQid].photo=dataUrl;
  const q=QUESTIONS.find(q=>q.id===S.camQid);
  const el=document.getElementById(`q-${S.camQid}`);
  if(el) el.outerHTML=renderQ(q);
  persist();
  toast('📷 תמונה נשמרה');
}

// ====== TOAST ======
function toast(msg,ms=2200){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

// ====== INIT ======
initHome();
</script>
