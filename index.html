<style>

#home{background:linear-gradient(160deg,#0d1b2a,#1b2838 55%,#1e3a5f);padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.hi{max-width:490px;width:100%}

.bs{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;font-size:17px;font-weight:800;margin-bottom:10px;box-shadow:0 4px 16px rgba(231,76,60,0.38)}
.br{width:100%;padding:13px;border-radius:14px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#90caf9;font-size:14px;font-weight:600}
#fs{background:#f0f4f8}
.tb{background:#fff;border-bottom:2px solid #e8ecf0;padding:10px 13px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:8px;flex-wrap:wrap}

.tbn{font-weight:800;font-size:14px;color:#2c3e50}
.sp{border-radius:14px;padding:3px 10px;font-weight:700;font-size:13px;color:#fff}
.tbb{display:flex;gap:7px}
.bpdf{border:1px solid #2980b9;background:#fff;color:#2980b9;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:600}
.bsv{border:none;background:linear-gradient(135deg,#2980b9,#1a5276);color:#fff;border-radius:8px;padding:7px 13px;font-size:13px;font-weight:700;min-width:66px}

.fb2{max-width:680px;margin:0 auto;padding:14px 13px 30px}
.fhd{border-radius:16px;padding:16px;margin-bottom:16px}
.fht{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px}
.pr{display:flex;justify-content:space-between;font-size:11px;color:#7f8c8d;margin:10px 0 5px}
.pb{height:7px;background:#e8ecf0;border-radius:99px;overflow:hidden}
.pf{height:100%;border-radius:99px;transition:width 0.4s}
.fb3{background:#fdedec;border-radius:10px;padding:11px 13px;margin-top:12px}
.sec{margin-bottom:13px}

.sr{display:flex;align-items:center;gap:7px}

.qt{font-weight:500;font-size:14px;color:#2c3e50;direction:rtl;margin-bottom:9px;line-height:1.5}

.qr{display:flex;gap:8px;align-items:center}
.qn{flex:1;border:1px solid #dce1e8;border-radius:8px;padding:7px 10px;font-size:13px;direction:rtl;background:rgba(255,255,255,0.8);color:#2c3e50}
.qcb{flex-shrink:0;width:40px;height:40px;border-radius:8px;border:1px solid #dce1e8;background:#fafbfc;font-size:18px;position:relative;display:flex;align-items:center;justify-content:center}
.qcb.hp{border:2px solid #2980b9;background:#ebf5fb}
.cc{position:absolute;top:-5px;right:-5px;background:#27ae60;color:#fff;border-radius:50%;width:15px;height:15px;font-size:9px;display:flex;align-items:center;justify-content:center;font-weight:900}
.qt2{margin-top:8px;cursor:zoom-in}
.qt2 img{height:68px;border-radius:8px;object-fit:cover;border:2px solid #2980b9}
.ff{display:flex;gap:10px;margin-top:14px;padding-bottom:env(safe-area-inset-bottom)}
.bpdf2{flex:1;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#2980b9,#1a5276);color:#fff;font-size:14px;font-weight:700}
.bfin{flex:2;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;font-size:15px;font-weight:800}
.mb{position:fixed;inset:0;background:#000a;z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.mbx{background:#fff;border-radius:20px 20px 0 0;padding:22px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.mh{width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 16px}
.cmb{position:fixed;inset:0;background:#000d;z-index:3000;display:flex;align-items:center;justify-content:center;padding:16px}
.cmbx{background:#1a1a2e;border-radius:22px;padding:20px;width:100%;max-width:420px;border:1px solid rgba(255,255,255,0.13);max-height:92vh;overflow-y:auto}
.cpv{border-radius:14px;overflow:hidden;background:#111;min-height:180px;display:flex;align-items:center;justify-content:center}
.cpv video{width:100%;max-height:260px;display:block;background:#000}
.cpv img{width:100%;max-height:260px;object-fit:cover;cursor:zoom-in}
.cpp{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px;text-align:center}
.ca{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.lbx{position:fixed;inset:0;background:#000e;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}
.lbx img{max-width:100%;max-height:90vh;border-radius:12px;object-fit:contain}
.lbc{position:fixed;top:16px;right:16px;background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:50%;width:44px;height:44px;font-size:20px}
.ri{border:1px solid #e4e8ed;border-radius:12px;margin-bottom:10px;overflow:hidden}
.rh{padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.rb{padding:13px;background:#fff}
.ibanner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a1a2e,#0d1b2a);border-top:2px solid rgba(144,202,249,0.3);padding:16px 18px;z-index:5000;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<div id="home" class="screen active">
  <div class="hi">
    <div class="hl"><span class="e">🍽️</span><h1>מערכת בקרת איכות</h1><p>ניר עציון — ביקורת מטבחים</p></div>
    <div class="hc">

  </div>
</div>

<div id="fs" class="screen">

  <div class="fb2">

  </div>
</div>

<div id="rm" class="mb" style="display:none" onclick="closeReports()">
  <div class="mbx" onclick="event.stopPropagation()">
    <div class="mh"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <span style="font-size:18px;font-weight:800;color:#2c3e50">📊 ביקורות שמורות</span>
      <button style="background:none;border:none;font-size:22px;color:#aaa" onclick="closeReports()">✕</button>
    </div>
    <div id="rl"></div>
  </div>
</div>

<div id="cm" class="cmb" style="display:none" onclick="closeCam()">

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="color:#fff;font-weight:800;font-size:16px">📷 צרף תמונה</span>
      <button style="background:none;border:none;color:#aaa;font-size:24px;line-height:1" onclick="closeCam()">✕</button>

      <div style="font-weight:700;color:#c0392b;font-size:13px" id="cerrt"></div>
      <div style="font-size:12px;color:#7f8c8d;margin-top:3px" id="cerrh"></div>
    </div>
    <div class="cpv" id="cpv">
      <div class="cpp"><span style="font-size:48px">📷</span><span style="color:#90caf9;font-size:13px">לחץ לצילום או בחר מהגלריה</span></div>
    </div>
    <canvas id="cc" style="display:none"></canvas>
    <input id="cfc" type="file" accept="image/*" capture="environment" style="display:none">
    <input id="cfg" type="file" accept="image/*" style="display:none">
    <div class="ca" id="ca"></div>
  </div>
</div>

<div id="lb" class="lbx" style="display:none" onclick="closeLB()">
  <img id="lbi" src=""><button class="lbc" onclick="closeLB()">✕</button>
</div>

<script>
const KITCHENS=["Bento","Nine Dine","Nona",'מרלו"ג',"בתי קפה - איילנס"];
const FORMS={
  food_safety:{label:"🛡️ בטיחות במזון",color:"#e74c3c",sections:[
    {title:"מערכות קירור",questions:["האם מתקיים שימוש במקררים לפי הייעוד שלו?","האם קיימת הפרדה בין גולמי למוכן לאכילה?","האם כל המזון מכוסה / עטוף?","האם נצפו מזון ללא מדבקת תאריך פתיחה?","האם ביצים טריות מאוחסנות במקום יעודי?"]},
    {title:"תהליכי ייצור: מטבח חם",questions:['האם מתקיימת עבודה ע"פ קוד צבעים הנהוג בניר עציון?',"האם קיים ברז וכיור + אמצעי היגיינה זמינים, תקינים ומלאים?","האם מתבצע מעקב טמפ' של המזון לכל אורך התהליך?","האם מתבצע תיעוד של בישול ושחזור מזון?","האם מתבצע תיעוד של מזון מצונן?","האם קיים סדר המזון על-גבי עגלות בצורה נכונה ועם מדבקה ברורה?","שמן הטיגון בצ'יפסר נקי? האם קיים תיעוד על סינון/החלפה?",'האם התבלינים/קטניות מאוחסנים בצורה תקינה כולל שם, תאריך פתיחה ותוקף?']},
    {title:"תהליכי ייצור: עיבוד בשר",questions:['האם מתקיימת עבודה ע"פ קוד צבעים הנהוג בניר עציון?',"האם קיים ברז וכיור + אמצעי היגיינה זמינים, תקינים ומלאים?",'האם קיימת הפרדה בין המדורים בזמן עבודה? אין ערבוב בין בע"ד','האם מתבצע תיעוד של הבע"ד המופשר?','האם הבע"ד מסודר על גסטרונומים מחוררים ומתועד במדבקה ייעודית?','האם התבלינים/קטניות מאוחסנים בצורה תקינה?']},
    {title:"תהליכי ייצור: חיטוי",questions:['האם מתקיימת עבודה ע"פ קוד צבעים הנהוג בניר עציון?',"האם קיים ברז וכיור + אמצעי היגיינה זמינים, תקינים ומלאים?","בדיקה מדגמית לריכוז חומר החיטוי","האם תהליך החיטוי מתועד בטופס?",'האם הירקות המחוטאים נמצאים בקירור ע"ג עגלה עם תאריך ייצור?']},
    {title:"תהליכי ייצור: עיבוד ירקות / הכנת סלטים",questions:['האם מתקיימת עבודה ע"פ קוד צבעים הנהוג בניר עציון?',"האם קיים ברז וכיור + אמצעי היגיינה זמינים, תקינים ומלאים?",'האם הירקות המחוטאים נמצאים בקירור ע"ג עגלה עם תאריך ייצור?',"האם הסלטים המוכנים מאוחסנים בקירור עד לזמן ההגשה?",'האם יש תיעוד של צינון מזון בטופס "קירור מהיר"?','האם התבלינים/קטניות מאוחסנים בצורה תקינה?']},
    {title:"אזור ההגשה וחדר אוכל",questions:['האם מתקיימת עבודה ע"פ קוד צבעים הנהוג בניר עציון?',"האם קיים ברז וכיור + אמצעי היגיינה זמינים, תקינים ומלאים?","האם נשמרות דוגמאות מזון ולמשך הזמן הנדרש ובמקרר ייעודי? (72 שעות)","האם מתקיים מילוי תקין של טופס דוגמאות מזון?","האם יש מגע ישיר בין המזון המוגש למוצרי עץ?"]},
    {title:"עובדים",questions:["האם העובדים לובשים בגדי עבודה נקיים? נעלי עבודה?","האם לעובדים יש כיסוי ראש?","האם נצפו עובדים ללא כפפות?","האם העובדים מעשנים בשטח המטבח וחדר האוכל?","האם נצפו עובדים שעובדים בניגוד לכללי בטיחות במזון?"]},
  ]},
  cleanliness:{label:"🧹 סיור ניקיון",color:"#2980b9",sections:[
    {title:"רחבת כניסה / חדר אוכל",questions:["האם אזור הקופות נקי","האם עמדת הצטיידות (סכום ומגשים) נקייה ומסודרת","האם אזור כניסה לחדר אוכל נקי","האם קיימים אמצעי היגיינה תקינים ומלאים?"]},
    {title:"עמדות הגשה",questions:["האם פלנצ'ות נקיות ומוכנות לעבודה","האם הצ'פסרים מכוסים ומכובים","האם המנדפים נקיים - עמדות הגשה","האם דלפקי הגשה ומשטחי עבודה נקיים","האם פסים קרים נקיים","האם פסים חמים נקיים","האם הריצפה והתעלות ריקות משאריות מזון - עמדות הגשה","האם מקררים בדלפקי הגשה ריקים ונקיים","האם קיימים אמצעי היגיינה תקינים ומלאים?"]},
    {title:"חדר אוכל מקצה לקצה",questions:["האם השולחנות והכיסאות נקיים (פירורים, כתמים)","האם עמדת מיקרוגל נקייה","האם הרצפה והשטיחים נקיים","האם עמדות שתייה נקיות ומלאות בכוסות","האם פחי אשפה מרוקנים ונקיים - חדר אוכל"]},
    {title:"מטבח חם",questions:["האם התנורים נקיים","האם המחבתות (פרימה) נקיות","האם הדוד מים נקי וללא אבנית","האם משטחי עבודה נקיים - מטבח חם","האם הריצפה והתעלות ריקות משאריות מזון - מטבח חם","האם פחי אשפה ריקים ונקיים - מטבח חם","פותחני קופסאות שימורים נקי וללא חלודה","האם בלסט צילר נקי - מטבח חם","האם מקררים נקיים","האם עגלות ופיילות נקיות"]},

// CAMERA
var CAM={si:null,qi:null,stream:null,preview:null};
function openCam(si,qi){
  CAM.si=si;CAM.qi=qi;CAM.stream=null;
  CAM.preview=sa()[si+'_'+qi+'_photo']||null;
  e('cerr').style.display='none';
  renderCam();e('cm').style.display='flex';
}
function closeCam(){if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop();});CAM.stream=null;}e('cm').style.display='none';}
function renderCam(){
  var pv=e('cpv'),ca=e('ca');
  if(CAM.preview){
    pv.innerHTML='<img src="'+CAM.preview+'" onclick="openLB(\''+CAM.preview+'\')">';
    ca.innerHTML='<div style="display:flex;gap:9px"><button style="flex:1;padding:12px;border-radius:12px;border:1px solid #e74c3c;background:transparent;color:#e74c3c;font-weight:600;font-size:14px;font-family:inherit" onclick="camRedo()">🔄 חזור</button><button style="flex:2;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;font-weight:800;font-size:15px;font-family:inherit" onclick="camConfirm()">✅ אשר תמונה</button></div>'+
    '<button style="background:none;border:none;color:#e74c3c;font-size:12px;text-align:center;padding:4px;font-family:inherit" onclick="camRemove()">🗑 הסר תמונה קיימת</button>';
  } else if(CAM.stream){
    pv.innerHTML='<video id="cv" autoplay playsinline muted webkit-playsinline></video>';
    var v=document.getElementById('cv');v.srcObject=CAM.stream;v.play().catch(function(){});
    ca.innerHTML='<button style="padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;font-weight:800;font-size:16px;font-family:inherit" onclick="camSnap()">⚡ צלם עכשיו</button>'+
    '<button style="background:none;border:none;color:#666;font-size:12px;text-align:center;font-family:inherit" onclick="camStop()">✕ ביטול מצלמה</button>';
  } else {
    pv.innerHTML='<div class="cpp"><span style="font-size:48px">📷</span><span style="color:#90caf9;font-size:13px">לחץ לצילום או בחר מהגלריה</span></div>';
    ca.innerHTML='<button style="padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#2980b9,#1a5276);color:#fff;font-weight:700;font-size:15px;font-family:inherit" onclick="camOpen()">'+(isIOS?'📷 צלם תמונה':'📷 פתח מצלמה')+'</button>'+
    '<button style="padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:#90caf9;font-weight:600;font-size:14px;font-family:inherit" onclick="e(\'cfg\').click()">🖼 בחר מהגלריה</button>';
  }
}
async function camOpen(){
  if(isIOS){e('cfc').click();return;}
  try{
    var s;
    try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'}}});}
    catch{s=await navigator.mediaDevices.getUserMedia({video:true});}
    CAM.stream=s;e('cerr').style.display='none';renderCam();
  }catch(err){
    var isPerm=err.name==='NotAllowedError'||err.name==='PermissionDeniedError';
    e('cerrt').textContent=isPerm?'🔒 אין הרשאת מצלמה':'📵 לא נמצאה מצלמה';
    e('cerrh').textContent=isPerm?'לחץ 🔒 בשורת הכתובת ← מצלמה ← אפשר':'השתמש בגלריה למטה';
    e('cerr').style.display='block';renderCam();
  }
}
function camSnap(){
  var v=document.getElementById('cv'),c=e('cc');if(!v||!c)return;
  c.width=v.videoWidth||640;c.height=v.videoHeight||480;
  c.getContext('2d').drawImage(v,0,0);
  CAM.preview=c.toDataURL('image/jpeg',0.82);
  camStop();renderCam();
}
function camStop(){if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop();});CAM.stream=null;}renderCam();}
function camRedo(){CAM.preview=null;renderCam();}
function camConfirm(){setA(CAM.si+'_'+CAM.qi+'_photo',CAM.preview);closeCam();renderForm();}
function camRemove(){setA(CAM.si+'_'+CAM.qi+'_photo',null);CAM.preview=null;closeCam();renderForm();}
e('cfc').onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(x){CAM.preview=x.target.result;renderCam();};r.readAsDataURL(f);this.value='';};
e('cfg').onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(x){CAM.preview=x.target.result;renderCam();};r.readAsDataURL(f);this.value='';};

function closeLB(){e('lb').style.display='none';}
