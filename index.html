<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="בקרת מטבח">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1b2a">
<title>בקרת איכות מטבחים</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f0f4f8;direction:rtl}
button{font-family:inherit;cursor:pointer;border:none;outline:none;transition:opacity 0.15s}
button:active{opacity:0.75}
input,select,textarea{font-family:inherit;outline:none}
.screen{display:none;min-height:100vh}
.screen.active{display:block}

/* HOME */
#home{background:linear-gradient(160deg,#0d1b2a,#1b2838 55%,#1e3a5f);padding:20px;padding-top:calc(20px + env(safe-area-inset-top));padding-bottom:calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center}
.hi{max-width:500px;width:100%}
.hl{text-align:center;margin-bottom:20px}
.hl .em{font-size:48px;display:block;margin-bottom:4px}
.hl h1{color:#fff;font-size:22px;font-weight:900}
.hl p{color:#90caf9;font-size:13px;margin-top:4px}
.hcard{background:rgba(255,255,255,0.07);border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,0.12);margin-bottom:12px}
.hlb{color:#90caf9;font-size:12px;font-weight:600;display:block;margin-bottom:4px}
.hfi{width:100%;border-radius:10px;border:none;background:rgba(255,255,255,0.1);color:#fff;padding:10px 13px;font-size:15px;margin-bottom:12px}
.hfi:last-child{margin-bottom:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px}
.fgbtn{padding:11px 6px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:#999;font-weight:400;font-size:11px;width:100%;transition:all 0.2s;line-height:1.3}
.fgbtn.on{border-width:2px;color:#fff;font-weight:700}
.hstart{width:100%;padding:14px;border-radius:14px;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;font-size:16px;font-weight:800;margin-bottom:9px;box-shadow:0 4px 16px rgba(231,76,60,0.38)}
.hrep{width:100%;padding:12px;border-radius:14px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:#90caf9;font-size:14px;font-weight:600}

/* FORM SCREEN */
#fs{background:#f0f4f8}
.tb{background:#fff;border-bottom:2px solid #e8ecf0;padding:9px 12px;padding-top:calc(9px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;gap:7px;flex-wrap:wrap}
.tbback{border:1px solid #dce1e8;background:#f8f9fa;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:#2c3e50}
.tbcenter{display:flex;align-items:center;gap:6px;flex:1;justify-content:center}
.tbname{font-weight:800;font-size:13px;color:#2c3e50;text-align:center}
.tbscore{border-radius:14px;padding:3px 9px;font-weight:700;font-size:12px;color:#fff}
.tbbtns{display:flex;gap:6px}
.btnpdf{border:1px solid #2980b9;background:#fff;color:#2980b9;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:600}
.btnmail{border:1px solid #8e44ad;background:#fff;color:#8e44ad;border-radius:8px;padding:6px 9px;font-size:11px;font-weight:600}
.btnsave{border:none;background:linear-gradient(135deg,#2980b9,#1a5276);color:#fff;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;min-width:60px}
.btnsave.ok{background:#27ae60}
.fbody{max-width:680px;margin:0 auto;padding:13px 12px 30px}

/* FORM HEADER */
.fhead{border-radius:16px;padding:14px;margin-bottom:14px}
.fhtop{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px}
.fhlabel{font-size:17px;font-weight:800}
.fhsub{color:#7f8c8d;font-size:12px;margin-top:2px}
.fhscore{text-align:center}
.fhpct{font-size:32px;font-weight:900;line-height:1}
.fhpass{font-size:11px;color:#7f8c8d;margin-top:2px}
.prow{display:flex;justify-content:space-between;font-size:11px;color:#7f8c8d;margin:9px 0 4px}
.pbar{height:6px;background:#e8ecf0;border-radius:99px;overflow:hidden}
.pfill{height:100%;border-radius:99px;transition:width 0.4s}
.failbox{background:#fdedec;border-radius:10px;padding:10px 12px;margin-top:10px}
.failtitle{font-weight:700;color:#e74c3c;margin-bottom:6px;font-size:12px}
.failitem{font-size:11px;color:#2c3e50;margin-bottom:2px;direction:rtl;line-height:1.5}

/* SECTIONS */
.sec{margin-bottom:12px}
.shead{display:flex;align-items:center;justify-content:space-between;background:#eef2f7;border-radius:10px;padding:9px 12px;cursor:pointer;user-select:none;margin-bottom:9px}
.shead.col{margin-bottom:0}
.sleft{display:flex;align-items:center;gap:5px}
.sright{display:flex;align-items:center;gap:6px}
.stitle{font-weight:700;font-size:13px;color:#2c3e50}
.sscore{border-radius:13px;padding:2px 8px;font-weight:700;font-size:11px;color:#fff}

/* QUESTION */
.q{border-radius:11px;padding:10px 12px;margin-bottom:6px;border:1px solid #e4e8ed;background:#fff;transition:background 0.2s,border-color 0.2s}
.qtext{font-weight:500;font-size:13px;color:#2c3e50;direction:rtl;margin-bottom:8px;line-height:1.5}
.qbtns{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:7px}
.qbtn{padding:5px 9px;border-radius:7px;border:1px solid #ddd;background:#fafafa;color:#888;font-weight:400;font-size:11px;white-space:nowrap;font-family:inherit}
.qbtn.on{font-weight:700;border-width:2px}
.qrow{display:flex;gap:7px;align-items:center}
.qnote{flex:1;border:1px solid #dce1e8;border-radius:7px;padding:6px 9px;font-size:12px;direction:rtl;background:rgba(255,255,255,0.8);color:#2c3e50}
.qcambtn{flex-shrink:0;width:36px;height:36px;border-radius:7px;border:1px solid #dce1e8;background:#fafbfc;font-size:16px;position:relative;display:flex;align-items:center;justify-content:center}
.qcambtn.hp{border:2px solid #2980b9;background:#ebf5fb}
.camcheck{position:absolute;top:-4px;right:-4px;background:#27ae60;color:#fff;border-radius:50%;width:13px;height:13px;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:900}
.qthumb{margin-top:7px;cursor:zoom-in}
.qthumb img{height:60px;border-radius:7px;object-fit:cover;border:2px solid #2980b9}

/* SECTION NOTE (for raw-style sections) */
.secnote{border:1px solid #dce1e8;border-radius:8px;padding:8px 11px;font-size:13px;direction:rtl;background:rgba(255,255,255,0.8);color:#2c3e50;width:100%;margin-bottom:7px}

/* FOOTER */
.ffoot{display:flex;gap:9px;margin-top:12px;padding-bottom:env(safe-area-inset-bottom)}
.btnpdf2{flex:1;padding:13px;border-radius:13px;border:none;background:linear-gradient(135deg,#2980b9,#1a5276);color:#fff;font-size:13px;font-weight:700}
.btnmail2{flex:1;padding:13px;border-radius:13px;border:none;background:linear-gradient(135deg,#8e44ad,#6c3483);color:#fff;font-size:13px;font-weight:700}
.btnfinish{flex:2;padding:13px;border-radius:13px;border:none;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;font-size:14px;font-weight:800}

/* MODALS */
.mbg{position:fixed;inset:0;background:#000a;z-index:2000;display:flex;align-items:flex-end;justify-content:center}
.mbox{background:#fff;border-radius:20px 20px 0 0;padding:20px;width:100%;max-width:640px;max-height:88vh;overflow-y:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.mhandle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 14px}
.cambg{position:fixed;inset:0;background:#000d;z-index:3000;display:flex;align-items:center;justify-content:center;padding:14px}
.cambox{background:#1a1a2e;border-radius:20px;padding:18px;width:100%;max-width:420px;border:1px solid rgba(255,255,255,0.13);max-height:92vh;overflow-y:auto}
.campv{border-radius:13px;overflow:hidden;background:#111;min-height:160px;display:flex;align-items:center;justify-content:center}
.campv video{width:100%;max-height:240px;display:block;background:#000}
.campv img{width:100%;max-height:240px;object-fit:cover;cursor:zoom-in}
.campph{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px;text-align:center}
.camacts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.lbg{position:fixed;inset:0;background:#000e;z-index:9999;display:flex;align-items:center;justify-content:center;padding:14px}
.lbg img{max-width:100%;max-height:90vh;border-radius:11px;object-fit:contain}
.lbclose{position:fixed;top:14px;right:14px;background:rgba(255,255,255,0.2);border:none;color:#fff;border-radius:50%;width:42px;height:42px;font-size:19px}

/* REPORTS */
.ritem{border:1px solid #e4e8ed;border-radius:11px;margin-bottom:9px;overflow:hidden}
.rhead{padding:11px 13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:7px}
.rbody{padding:12px;background:#fff}

/* INSTALL BANNER */
.ibanner{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1a1a2e,#0d1b2a);border-top:2px solid rgba(144,202,249,0.3);padding:14px 16px;z-index:5000;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
</style>
</head>
<body>

<div id="home" class="screen active">
  <div class="hi">
    <div class="hl"><span class="em">🍽️</span><h1>מערכת בקרת איכות</h1><p>ניר עציון — ביקורת מטבחים</p></div>
    <div class="hcard">
      <label class="hlb">שם המבקר</label>
      <input id="ii" class="hfi" placeholder="הזן שם מלא..." style="direction:rtl">
      <label class="hlb">מייל לשליחת הדוח</label>
      <input id="imail" class="hfi" type="email" placeholder="your@email.com" style="direction:ltr;text-align:left">
      <label class="hlb">מטבח / תחנה</label>
      <select id="ik" class="hfi"></select>
      <label class="hlb">תאריך ביקורת</label>
      <input id="idate" type="date" class="hfi" style="margin-bottom:14px">
      <label class="hlb" style="margin-bottom:8px">סוג ביקורת</label>
      <div class="fgrid" id="fg"></div>
    </div>
    <button class="hstart" onclick="startInspection()">🚀 התחל ביקורת</button>
    <button class="hrep" onclick="openReports()">📊 ביקורות שמורות (<span id="rc">0</span>)</button>
  </div>
</div>

<div id="fs" class="screen">
  <div class="tb">
    <button class="tbback" onclick="goHome()">← חזרה</button>
    <div class="tbcenter">
      <span class="tbname" id="tbn"></span>
      <span class="tbscore" id="tbs">0%</span>
    </div>
    <div class="tbbtns">
      <button class="btnpdf" onclick="doPDF()">📄</button>
      <button class="btnmail" onclick="doMail()">📧</button>
      <button class="btnsave" id="bsv" onclick="doSave()">💾 שמור</button>
    </div>
  </div>
  <div class="fbody">
    <div id="fhead"></div>
    <div id="fsecs"></div>
    <div class="ffoot">
      <button class="btnpdf2" onclick="doPDF()">📄 PDF</button>
      <button class="btnmail2" onclick="doMail()">📧 שלח מייל</button>
      <button class="btnfinish" onclick="doFinish()">✅ סיים ושמור</button>
    </div>
  </div>
</div>

<div id="rm" class="mbg" style="display:none" onclick="closeReports()">
  <div class="mbox" onclick="event.stopPropagation()">
    <div class="mhandle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <span style="font-size:17px;font-weight:800;color:#2c3e50">📊 ביקורות שמורות</span>
      <button style="background:none;border:none;font-size:20px;color:#aaa" onclick="closeReports()">✕</button>
    </div>
    <div id="rl"></div>
  </div>
</div>

<div id="cm" class="cambg" style="display:none" onclick="closeCam()">
  <div class="cambox" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="color:#fff;font-weight:800;font-size:15px">📷 צרף תמונה</span>
      <button style="background:none;border:none;color:#aaa;font-size:22px;line-height:1" onclick="closeCam()">✕</button>
    </div>
    <div id="cerr" style="display:none;background:#fdedec;border:1px solid rgba(231,76,60,0.3);border-radius:9px;padding:9px 12px;margin-bottom:11px;direction:rtl">
      <div style="font-weight:700;color:#c0392b;font-size:12px" id="cerrt"></div>
      <div style="font-size:11px;color:#7f8c8d;margin-top:2px" id="cerrh"></div>
    </div>
    <div class="campv" id="cpv"><div class="campph"><span style="font-size:44px">📷</span><span style="color:#90caf9;font-size:12px">לחץ לצילום או בחר מהגלריה</span></div></div>
    <canvas id="cc" style="display:none"></canvas>
    <input id="cfc" type="file" accept="image/*" capture="environment" style="display:none">
    <input id="cfg" type="file" accept="image/*" style="display:none">
    <div class="camacts" id="ca"></div>
  </div>
</div>

<div id="lb" class="lbg" style="display:none" onclick="closeLB()">
  <img id="lbi" src=""><button class="lbclose" onclick="closeLB()">✕</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════
// KITCHENS & FORMS DATA
// ═══════════════════════════════════════════════════════════════════
const KITCHENS=["Bento","Nine Dine","Nona","מרלוג","בתי קפה - איילנס"];
const KD={"מרלוג":'מרלו"ג'};
function kname(k){return KD[k]||k;}

// Status options
const ST=[
  {v:"ok",    l:"✅ תקין",        c:"#27ae60",bg:"#eafaf1",p:100},
  {v:"partial",l:"⚠️ חלקי",       c:"#f39c12",bg:"#fef9e7",p:50},
  {v:"fail",  l:"❌ לא תקין",     c:"#e74c3c",bg:"#fdedec",p:0},
  {v:"na",    l:"➖ לא רלוונטי",  c:"#95a5a6",bg:"#f2f3f4",p:null},
];

// ── SAFETY AT WORK (identical for all kitchens) ─────────────────────
const SAFETY_WORK={
  label:"🦺 בטיחות בעבודה", color:"#c0392b",
  sections:[
    {title:"חשמל",questions:[
      "רבי שקע (מפצלים)?",
      "שקעים/תקעים לא תקינים",
      "תשתיות- סדר בדלפקים- חיווט, עמדה תקינה",
      "שקעים מוגנים מים?",
    ]},
    {title:"ציוד / מחסן",questions:[
      "שימוש בציוד מגן אישי — נעלי עבודה תקניים",
      "כפפות מגן (חומרים מסוכנים, סיכוך, חום)",
      "משקפי מגן",
      "ציוד במחסן: ציוד ללא שימוש, אחסון בצורה תקנית, מדפים מקובעים",
      "אחסון חומרים מסוכנים בארון ייעודי ומשולט — מאצרות",
      "וודא קיום הוראות הבטיחות בשימוש בחומרים",
      "וודא החזרת חומרי הניקיון לארון הייעודי בסיום השימוש",
      'וודא שהציוד מונח במרחק מינימלי של 40 ס"מ מגופי התאורה',
      "וודא כי האחסון נמוך מ-0.5 מטר מגובה המתז",
      "וודא שאין אחסון של ציוד כבד בגובה",
    ]},
    {title:"תאורה, שילוט, יציאות חירום",questions:[
      "תאורה, שילוט ויציאות חירום תקינות",
      "הגישה ליציאה/מעברי המטבח/שולחנות עבודה פנויה",
    ]},
    {title:"עבודת מטבח — סכינים",questions:[
      "וודא אחסון סכינים/כלים חדים בכלי ייעודי/מגנט",
      "וודא התאמת סכין למשימה",
    ]},
    {title:"עמדת עבודה",questions:[
      "עמדה מסודרת — לא קיימות סכנות לעובדים",
      "וודא קיום עבודת צוות בעמדות צמודות",
      "עמדות חיצוניות — וודא מניעת סכנה מסועדים",
    ]},
    {title:"רצפת עבודה",questions:[
      "אין מים על הרצפה בכמות מסוכנת",
      "רצפה נקייה מחלקי מזון",
      "קרח על רצפת מקפיא",
      "אין שמן על הרצפה (רצפה שומנית)",
    ]},
    {title:"צ'יפסר",questions:[
      "וודא ניקיון הרצפה בצמוד לצ'יפסר",
      "וודא פינוי שמן קר בלבד מהצ'יפסר",
      "וודא פינוי השמן למיכלים ייעודיים",
    ]},
    {title:"עבודה עם מכונות",questions:[
      "הכרת מכשיר העבודה ותקינות חלקי המכשיר",
      "עבודה על המכשיר רק לפי הוראות היצרן",
      "בסיום העבודה — ניתוק מהחשמל וניקוי כמצוין בהוראות היצרן",
    ]},
    {title:"שינוע ועבודה פיזית",questions:[
      "אין להרים ציוד כבד/סירים ללא עזרה נכונה",
      "שינוע עגלות לפי נוהל",
      "מעבר כלים/ציוד חם במטבח",
      "הרמת סירים כבדים ללא עזרה",
    ]},
    {title:"חומרים מסוכנים ובטיחות כללית",questions:[
      "האם כלל החומרים מסומנים (מדבקת שם החומר)?",
      "האם החומרים בתוקף?",
      "האם חומרי הניקוי מאוחסנים במאצרות בנפח של 110% מהמיכל הגדול ביותר?",
      "האם יש קלסר של כלל החומרים המסוכנים המצויים בעיסוקם של העובדים?",
      "יש לוודא כי גלילי הגז של הסודה מקובעים ומשולטים",
      "האם קיים חשמל חשוף — סכנת התחשמלות?",
      "האם השקעים תקינים (לא שבורים ובעלי מכסה הגנה באזורים רטובים)?",
      "האם דלתות החרום תקינות ולא נעולות?",
      "האם קיימות הוראות בטיחות בסמוך לעמדות העבודה?",
      "האם העובדים משתמשים בציוד מגן אישי בהתאם לסיכון?",
      "האם מנגנון אדם לכוד במקפיא תקין?",
      "האם המדפים מקובעים?",
      "יש לתשאל 2 עובדים לפחות — ולוודא כי עברו הדרכה ומכירים את הסיכונים בעמדת העבודה",
    ]},
  ]
};

// ── FOOD SAFETY FORMS ────────────────────────────────────────────────
const FOOD_SAFETY={
  "Bento":{label:"🛡️ בטיחות מזון — בנטו",color:"#e74c3c",sections:[
    {title:"עמדות הגשה",questions:[
      'האם מתקיימת עבודה ע"פ קוד צבעים הנהוג בניר עציון?',
      "האם הטמפ' של המזון בהגשה תקינה?",

// ── FORM MAP per kitchen ──────────────────────────────────────────────
function getFormsForKitchen(k){
  var forms=[];
  // All kitchens get safety at work
  forms.push({key:'safety_work',data:SAFETY_WORK});
  if(FOOD_SAFETY[k]) forms.push({key:'food_safety',data:FOOD_SAFETY[k]});
  if(EXPIRY[k])      forms.push({key:'expiry',data:EXPIRY[k]});
  if(CLEAN[k])       forms.push({key:'clean',data:CLEAN[k]});
  return forms;
}

// ═══════════════════════════════════════════════════════════════════
function LS(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d;}catch{return d;}}
function SLS(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}

var S={
  kitchen:KITCHENS[0],
  formIdx:0,
  inspector:'',
  email:'',
  date:new Date().toISOString().split('T')[0],
  answers:LS('kqA10',{}),
  reports:LS('kqR10',[]),
  col:{}
};

function sk(){return S.kitchen+'|'+S.formIdx+'|'+S.date;}
function sa(){return S.answers[sk()]||{};}
function setA(k,v){if(!S.answers[sk()])S.answers[sk()]={};S.answers[sk()][k]=v;SLS('kqA10',S.answers);}
function getCurForm(){return getFormsForKitchen(S.kitchen)[S.formIdx]?.data||null;}
function getCurSections(){var f=getCurForm();return f?f.sections:[];}

function calcScore(sections,ans){
  var all=[],sum=0;
  sections.forEach(function(s,si){s.questions.forEach(function(_,qi){all.push(si+'_'+qi);});});
  var rel=all.filter(function(k){return ans[k]&&ans[k]!='na';});
  rel.forEach(function(k){var st=ST.find(function(s){return s.v===ans[k];});sum+=(st&&st.p!=null?st.p:0);});
  return{pct:rel.length?Math.round(sum/rel.length):0,answered:rel.length,total:all.length};
}
function color(p){return p>=85?'#27ae60':p>=60?'#f39c12':'#e74c3c';}
function e(id){return document.getElementById(id);}
var isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);

// HOME
// ═══════════════════════════════════════════════════════════════════
function initHome(){
  var sel=e('ik');
  sel.innerHTML=KITCHENS.map(function(k){return'<option value="'+k+'">'+kname(k)+'</option>';}).join('');
  sel.value=S.kitchen;
  sel.onchange=function(ev){S.kitchen=ev.target.value;S.formIdx=0;renderFormBtns();};
  e('ii').value=S.inspector;e('ii').oninput=function(ev){S.inspector=ev.target.value;};
  e('imail').value=S.email;e('imail').oninput=function(ev){S.email=ev.target.value;};
  e('idate').value=S.date;e('idate').onchange=function(ev){S.date=ev.target.value;};
  renderFormBtns();
  e('rc').textContent=S.reports.length;
}

function renderFormBtns(){
  var forms=getFormsForKitchen(S.kitchen);
  var fg=e('fg');
  fg.innerHTML=forms.map(function(f,i){
    var on=S.formIdx===i;
    var col=f.data.color;
    return '<button class="fgbtn'+(on?' on':'')+'" style="'+(on?'border-color:'+col+';border-width:2px;background:'+col+'28;color:#fff;font-weight:700':'')+'" onclick="selForm('+i+',this,\''+col+'\')">'+f.data.label+'</button>';
  }).join('');
}

function selForm(idx,btn,col){
  S.formIdx=idx;
  document.querySelectorAll('.fgbtn').forEach(function(b){b.className='fgbtn';b.style.cssText='';});
  btn.className='fgbtn on';btn.style.borderColor=col;btn.style.borderWidth='2px';btn.style.background=col+'28';btn.style.color='#fff';btn.style.fontWeight='700';
}

function show(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});e(id).classList.add('active');window.scrollTo(0,0);}
function startInspection(){S.col={};show('fs');renderForm();}
function goHome(){show('home');initHome();}

// FORM RENDER
// ═══════════════════════════════════════════════════════════════════
function renderForm(){
  var f=getCurForm(),secs=getCurSections(),ans=sa();
  if(!f)return;
  var r=calcScore(secs,ans),p=r.pct,col=color(p);
  // Topbar
  e('tbn').textContent=kname(S.kitchen);
  var sp=e('tbs');sp.textContent=p+'%';sp.style.background=col;
  // Failed items
  var failed=[];
  secs.forEach(function(s,si){s.questions.forEach(function(q,qi){if(ans[si+'_'+qi]==='fail')failed.push({q:q,k:si+'_'+qi,t:s.title});});});
  // Photo count
  var phCount=0;secs.forEach(function(s,si){s.questions.forEach(function(_,qi){if(ans[si+'_'+qi+'_photo'])phCount++;});});
  // Header
  e('fhead').innerHTML='<div class="fhead" style="background:linear-gradient(135deg,'+f.color+'12,'+f.color+'04);border:2px solid '+f.color+'25">'+
    '<div class="fhtop"><div><div class="fhlabel" style="color:'+f.color+'">'+f.label+'</div>'+
    '<div class="fhsub">'+kname(S.kitchen)+' · '+S.date+(S.inspector?' · '+S.inspector:'')+
    (phCount?' · 📷'+phCount:'')+
    (S.email?' · 📧'+S.email:'')+'</div></div>'+
    '<div class="fhscore"><div class="fhpct" style="color:'+col+'">'+p+'%</div>'+
    '<div class="fhpass">'+(p>=60?'✓ עובר':'✗ לא עובר')+'</div></div></div>'+
    '<div class="prow"><span>'+r.answered+'/'+r.total+' שאלות נענו</span><span style="color:'+col+';font-weight:700">'+p+'%</span></div>'+
    '<div class="pbar"><div class="pfill" style="width:'+p+'%;background:'+col+'"></div></div>'+
    (failed.length?'<div class="failbox"><div class="failtitle">❌ ממצאים הדורשים טיפול ('+failed.length+')</div>'+
    failed.map(function(x){return'<div class="failitem"><b>'+x.t+':</b> '+x.q+(ans[x.k+'_notes']?'<span style="color:#e74c3c"> — '+ans[x.k+'_notes']+'</span>':'')+'</div>';}).join('')+'</div>':'')+
    '</div>';
  // Sections
  e('fsecs').innerHTML=secs.map(function(s,si){return renderSec(s,si,ans);}).join('');
}

function renderSec(s,si,ans){
  var qk=s.questions.map(function(_,qi){return si+'_'+qi;});
  var rel=qk.filter(function(k){return ans[k]&&ans[k]!='na';});
  var pas=qk.filter(function(k){return ans[k]==='ok';});
  var p=rel.length?Math.round(pas.length/rel.length*100):null;
  var col=p!=null?color(p):'#ccc';
  var hp=qk.some(function(k){return ans[k+'_photo'];});
  var isColl=S.col[si];
  return '<div class="sec"><div class="shead'+(isColl?' col':'')+'" onclick="togSec('+si+')">'+
    '<div class="sleft">'+(hp?'<span style="font-size:10px">📷</span>':'')+
    '<span class="stitle">'+s.title+'</span></div>'+
    '<div class="sright"><span style="font-size:10px;color:#7f8c8d">'+rel.length+'/'+s.questions.length+'</span>'+
    (p!=null?'<span class="sscore" style="background:'+col+'">'+p+'%</span>':'')+
    '<span style="color:#bbb;font-size:12px">'+(isColl?'▼':'▲')+'</span></div></div>'+
    '<div'+(isColl?' style="display:none"':'')+'>'
    +s.questions.map(function(q,qi){return renderQ(q,si,qi,ans);}).join('')+
    '</div></div>';
}

function renderQ(q,si,qi,ans){
  var k=si+'_'+qi,v=ans[k],st=ST.find(function(s){return s.v===v;}),note=ans[k+'_notes']||'',ph=ans[k+'_photo']||'';
  return '<div class="q" style="'+(st?'background:'+st.bg+';border-color:'+st.c+'44':'')+'">'+
    '<div class="qtext">'+q+'</div><div class="qbtns">'+
    ST.map(function(s){return'<button class="qbtn'+(v===s.v?' on':'')+'" style="'+(v===s.v?'background:'+s.bg+';color:'+s.c+';border-color:'+s.c:'')+'" onclick="ansQ('+si+','+qi+',\''+s.v+'\')">'+s.l+'</button>';}).join('')+
    '</div><div class="qrow">'+
    '<input class="qnote" placeholder="הערת מבקר..." value="'+note.replace(/"/g,'&quot;')+'" oninput="noteQ('+si+','+qi+',this.value)">'+
    '<button class="qcambtn'+(ph?' hp':'')+'" onclick="openCam('+si+','+qi+')" style="font-family:inherit">📷'+(ph?'<span class="camcheck">✓</span>':'')+' </button>'+
    '</div>'+(ph?'<div class="qthumb"><img src="'+ph+'" onclick="openLB(\''+ph+'\')"></div>':'')+
    '</div>';
}

function togSec(si){S.col[si]=!S.col[si];renderForm();}
function ansQ(si,qi,v){var k=si+'_'+qi,cur=sa()[k];setA(k,cur===v?null:v);renderForm();}
function noteQ(si,qi,val){
  setA(si+'_'+qi+'_notes',val);
  var r=calcScore(getCurSections(),sa()),p=r.pct,col=color(p),sp=e('tbs');
  if(sp){sp.textContent=p+'%';sp.style.background=col;}
}

function doSave(){
  var f=getCurForm();
  S.reports=[{
    kitchen:S.kitchen,formKey:S.formIdx,formLabel:f?f.label:'',
    date:S.date,time:new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}),
    inspector:S.inspector,email:S.email,answers:Object.assign({},sa())
  },...S.reports].slice(0,80);
  SLS('kqR10',S.reports);
  var b=e('bsv');b.textContent='✓ נשמר!';b.classList.add('ok');
  setTimeout(function(){b.textContent='💾 שמור';b.classList.remove('ok');},2200);
}
function doFinish(){doSave();goHome();}

    '<button onclick="window.print()" style="padding:11px 26px;background:#2980b9;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-family:Arial">הדפס / שמור PDF</button>'+
    '</div></div></body></html>';
}

function downloadHTML(html,fname){
  var blob=new Blob([html],{type:'text/html;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},3000);
}

function doPDF(){
  var f=getCurForm(),secs=getCurSections();
  if(!f)return;
  var html=makePDFHtml(f.label,secs,sa(),S.kitchen,S.date,S.inspector,S.email);
  downloadHTML(html,'דוח-'+kname(S.kitchen)+'-'+S.date+'.html');
}

// EMAIL
// ═══════════════════════════════════════════════════════════════════
function doMail(){
  var f=getCurForm(),secs=getCurSections();
  if(!f){alert('אין טופס פעיל');return;}
  var targetEmail=S.email||prompt('הזן כתובת מייל לשליחה:','');
  if(!targetEmail){return;}
  var r=calcScore(secs,sa()),p=r.pct;
  var ans=sa();
  var failed=[];
  secs.forEach(function(s,si){s.questions.forEach(function(q,qi){if(ans[si+'_'+qi]==='fail')failed.push(s.title+': '+q+(ans[si+'_'+qi+'_notes']?' — '+ans[si+'_'+qi+'_notes']:''));});});
  var subject='דוח ביקורת — '+f.label+' — '+kname(S.kitchen)+' — '+S.date;
  var body='דוח ביקורת איכות\n'+
    '========================\n'+
    'מטבח: '+kname(S.kitchen)+'\n'+
    'ביקורת: '+f.label+'\n'+
    'תאריך: '+S.date+'\n'+
    'שעה: '+new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'})+'\n'+
    'מבקר: '+(S.inspector||'לא צוין')+'\n'+
    'ציון: '+p+'% '+(p>=60?'(עובר)':'(לא עובר)')+'\n\n';
  if(failed.length){
    body+='ממצאים הדורשים טיפול ('+failed.length+'):\n';
    failed.forEach(function(f,i){body+=(i+1)+'. '+f+'\n';});
    body+='\n';
  }else{
    body+='לא נמצאו ממצאים הדורשים טיפול.\n\n';
  }
  body+='* הדוח המלא עם תמונות ניתן לייצוא כ-PDF מהאפליקציה.';
  var mailLink='mailto:'+encodeURIComponent(targetEmail)+
    '?subject='+encodeURIComponent(subject)+
    '&body='+encodeURIComponent(body);
  window.location.href=mailLink;
}

function openReports(){
  var rl=e('rl');
  if(!S.reports.length){rl.innerHTML='<div style="text-align:center;color:#ccc;padding:36px;font-size:14px">אין ביקורות שמורות עדיין</div>';}
  else{rl.innerHTML=S.reports.map(function(r,i){return rItem(r,i);}).join('');}
  e('rm').style.display='flex';
}
function closeReports(){e('rm').style.display='none';}

function rItem(r,i){
  // Get sections from saved form
  var forms=getFormsForKitchen(r.kitchen||'Bento');
  var fdata=forms[r.formKey]?.data||forms[0]?.data;
  var secs=fdata?fdata.sections:[];
  var res=calcScore(secs,r.answers||{}),p=res.pct,col=color(p);
  var ents=Object.entries(r.answers||{});
  var ok=ents.filter(function(x){return x[1]==='ok'&&!x[0].includes('_');}).length;
  var fail=ents.filter(function(x){return x[1]==='fail'&&!x[0].includes('_');}).length;
  var ph=ents.filter(function(x){return x[0].includes('_photo')&&x[1];});
  var bg=p>=85?'#eafaf1':p>=60?'#fef9e7':'#fdedec';
  return '<div class="ritem"><div class="rhead" style="background:'+bg+'" onclick="togRep('+i+')">'+
    '<div><div style="font-weight:700;font-size:13px;color:#2c3e50">'+kname(r.kitchen||'')+'</div>'+
    '<div style="color:#7f8c8d;font-size:11px">'+(r.formLabel||'')+' · '+r.date+' · '+r.time+(r.inspector?' · '+r.inspector:'')+
    (ph.length?' <span style="color:#2980b9">📷'+ph.length+'</span>':'')+
    (r.email?' <span style="color:#8e44ad">📧</span>':'')+
    '</div></div>'+
    '<div style="display:flex;gap:6px;align-items:center">'+
    '<span style="color:#27ae60;font-weight:700;font-size:11px">✅'+ok+'</span>'+
    '<span style="color:#e74c3c;font-weight:700;font-size:11px">❌'+fail+'</span>'+
    '<span style="border-radius:13px;padding:2px 9px;font-weight:800;font-size:12px;color:#fff;background:'+col+'">'+p+'%</span>'+
    '<span style="color:#ccc" id="ra'+i+'">▼</span></div></div>'+
    '<div class="rbody" id="rb'+i+'" style="display:none">'+
    (ph.length?'<div style="font-weight:600;color:#2980b9;font-size:11px;margin-bottom:6px">📷 תמונות</div>'+
    '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px">'+ph.map(function(x){return'<img src="'+x[1]+'" onclick="openLB(\''+x[1]+'\')" style="height:52px;width:52px;object-fit:cover;border-radius:6px;border:1px solid #ddd;cursor:zoom-in">';}).join('')+'</div>':'')+
    '<div style="display:flex;gap:8px">'+
    '<button style="flex:1;padding:9px;border-radius:9px;border:none;background:linear-gradient(135deg,#2980b9,#1a5276);color:#fff;font-weight:700;font-size:12px;font-family:inherit" onclick="exportR('+i+')">📄 PDF</button>'+
    '<button style="flex:1;padding:9px;border-radius:9px;border:none;background:linear-gradient(135deg,#8e44ad,#6c3483);color:#fff;font-weight:700;font-size:12px;font-family:inherit" onclick="mailR('+i+')">📧 מייל</button>'+
    '<button style="padding:9px 12px;border-radius:9px;border:1px solid #e74c3c;background:transparent;color:#e74c3c;font-weight:600;font-size:12px;font-family:inherit" onclick="delR('+i+')">🗑</button></div>'+
    '</div></div>';
}

function togRep(i){
  var b=e('rb'+i),a=e('ra'+i),op=b.style.display==='block';
  b.style.display=op?'none':'block';a.textContent=op?'▼':'▲';
}
function delR(i){if(!confirm('למחוק ביקורת זו?'))return;S.reports.splice(i,1);SLS('kqR10',S.reports);openReports();}

function exportR(i){
  var r=S.reports[i];

// ═══════════════════════════════════════════════════════════════════
var CAM={si:null,qi:null,stream:null,preview:null};
function openCam(si,qi){
  CAM.si=si;CAM.qi=qi;CAM.stream=null;
  CAM.preview=sa()[si+'_'+qi+'_photo']||null;
  e('cerr').style.display='none';renderCam();e('cm').style.display='flex';
}
function closeCam(){if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop();});CAM.stream=null;}e('cm').style.display='none';}
function renderCam(){
  var pv=e('cpv'),ca=e('ca');
  if(CAM.preview){
    pv.innerHTML='<img src="'+CAM.preview+'" onclick="openLB(\''+CAM.preview+'\')">';
    ca.innerHTML='<div style="display:flex;gap:8px">'+
      '<button style="flex:1;padding:11px;border-radius:11px;border:1px solid #e74c3c;background:transparent;color:#e74c3c;font-weight:600;font-size:13px;font-family:inherit" onclick="camRedo()">🔄 חזור</button>'+
      '<button style="flex:2;padding:11px;border-radius:11px;border:none;background:linear-gradient(135deg,#27ae60,#1e8449);color:#fff;font-weight:800;font-size:14px;font-family:inherit" onclick="camConfirm()">✅ אשר תמונה</button></div>'+
      '<button style="background:none;border:none;color:#e74c3c;font-size:11px;text-align:center;padding:3px;font-family:inherit" onclick="camRemove()">🗑 הסר תמונה קיימת</button>';
  }else if(CAM.stream){
    pv.innerHTML='<video id="cv" autoplay playsinline muted webkit-playsinline></video>';
    var v=document.getElementById('cv');v.srcObject=CAM.stream;v.play().catch(function(){});
    ca.innerHTML='<button style="padding:13px;border-radius:11px;border:none;background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;font-weight:800;font-size:15px;font-family:inherit" onclick="camSnap()">⚡ צלם עכשיו</button>'+
      '<button style="background:none;border:none;color:#666;font-size:11px;text-align:center;font-family:inherit" onclick="camStop()">✕ ביטול מצלמה</button>';
  }else{
    pv.innerHTML='<div class="campph"><span style="font-size:44px">📷</span><span style="color:#90caf9;font-size:12px">לחץ לצילום או בחר מהגלריה</span></div>';
    ca.innerHTML='<button style="padding:13px;border-radius:11px;border:none;background:linear-gradient(135deg,#2980b9,#1a5276);color:#fff;font-weight:700;font-size:14px;font-family:inherit" onclick="camOpen()">'+(isIOS?'📷 צלם תמונה':'📷 פתח מצלמה')+'</button>'+
      '<button style="padding:12px;border-radius:11px;border:1px solid rgba(255,255,255,0.25);background:rgba(255,255,255,0.08);color:#90caf9;font-weight:600;font-size:13px;font-family:inherit" onclick="e(\'cfg\').click()">🖼 בחר מהגלריה</button>';
  }
}
async function camOpen(){
  if(isIOS){e('cfc').click();return;}
  try{
    var s;
    try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:'environment'}}});}
    catch{s=await navigator.mediaDevices.getUserMedia({video:true});}
    CAM.stream=s;e('cerr').style.display='none';renderCam();
  }catch(err){
    var isPerm=err.name==='NotAllowedError'||err.name==='PermissionDeniedError';
    e('cerrt').textContent=isPerm?'🔒 אין הרשאת מצלמה':'📵 לא נמצאה מצלמה';
    e('cerrh').textContent=isPerm?'לחץ 🔒 בשורת הכתובת ← מצלמה ← אפשר':'השתמש בגלריה למטה';
    e('cerr').style.display='block';renderCam();
  }
}
function camSnap(){
  var v=document.getElementById('cv'),c=e('cc');if(!v||!c)return;
  c.width=v.videoWidth||640;c.height=v.videoHeight||480;
  c.getContext('2d').drawImage(v,0,0);
  CAM.preview=c.toDataURL('image/jpeg',0.82);camStop();renderCam();
}
function camStop(){if(CAM.stream){CAM.stream.getTracks().forEach(function(t){t.stop();});CAM.stream=null;}renderCam();}
function camRedo(){CAM.preview=null;renderCam();}
function camConfirm(){setA(CAM.si+'_'+CAM.qi+'_photo',CAM.preview);closeCam();renderForm();}
function camRemove(){setA(CAM.si+'_'+CAM.qi+'_photo',null);CAM.preview=null;closeCam();renderForm();}
e('cfc').onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(x){CAM.preview=x.target.result;renderCam();};r.readAsDataURL(f);this.value='';};
e('cfg').onchange=function(ev){var f=ev.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(x){CAM.preview=x.target.result;renderCam();};r.readAsDataURL(f);this.value='';};
